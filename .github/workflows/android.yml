name: Android app (APK)

on:
  push:
    branches: [main]
    paths: ['site/**', 'android-app/**', '.github/workflows/android.yml', '.github/copy-site-engine.sh']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      TQ_VERSION_CODE: ${{ github.run_number }}
      TQ_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then echo "::error title=Android SDK::not found at $SDK"; exit 1; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "::notice title=Android SDK::$SDK platforms: $(ls $SDK/platforms | tr '\n' ' ') build-tools: $(ls $SDK/build-tools | tr '\n' ' ')"

      - name: Copy Fairy-Stockfish browser runtime
        run: bash ../.github/copy-site-engine.sh

      - name: Copy the website into the app
        working-directory: android-app
        run: |
          python3 ../site/gen-sw.py
          bash ../.github/run-logged.sh npm ci
          bash ../.github/run-logged.sh npm run sync

      - name: Release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "TQ_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "TQ_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "TQ_KEY_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "TQ_KEY_ALIAS=twinqueens" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set - the APK is signed with a temporary debug key"
          fi

      - name: Build APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          bash ../../.github/run-logged.sh ./gradlew --no-daemon --console=plain assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/twin-queens.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: twin-queens-apk
          path: twin-queens.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.TQ_VERSION_NAME }}
          name: Twin Queens Chess ${{ env.TQ_VERSION_NAME }} (Android)
          body: |
            Android app for Twin Queens Chess — chess on a 9×8 board with two queens per side.
            Install: download twin-queens.apk on your phone and open it (allow installing from this source when asked).
          files: twin-queens.apk
          make_latest: true
