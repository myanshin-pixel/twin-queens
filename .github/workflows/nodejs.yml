name: Nodejs-CI

# Server CI from pychess-variants: runs on pull requests and on demand only,
# so pushes of the website/app don't wait behind it.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'yarn'
    - run: yarn install
    - run: yarn lint
    - run: yarn typecheck
    - run: yarn dev
    - run: yarn md
    - run: yarn test
