name: Website (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml', '.github/copy-site-engine.sh']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Copy Fairy-Stockfish browser runtime
        run: bash .github/copy-site-engine.sh
      - name: Refresh offline cache list
        run: python3 site/gen-sw.py && rm site/gen-sw.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
