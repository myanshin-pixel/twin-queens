<main>
  <section class="hero">

        <a class="btn big" href="play.html?mode=pvp" data-t="playFriend"></a>

    </div>

      <div class="rcard"><div class="big gold">×1,77</div><h3 data-l="w1h"></h3><p data-l="w1"></p></div>

      <div class="rcard"><h3 data-l="r2h"></h3><p data-l="r2"></p></div>
      <div class="rcard"><h3 data-l="r3h"></h3><p data-l="r3"></p></div>
    </div>

<footer class="footer">

<script src="i18n.js"></script>
<script>
(function(){
var L={
  ru:{
    lead:'Классика изучена? Попробуйте новый уровень. Шахматы на доске 9 на 8, где у каждой стороны по два ферзя: знакомые правила, больше вариантов и ни одной заученной схемы. Все равны — побеждает логика.',
    s1:'Новые шахматы с пустыми рейтингами и теорией.',s2:'Всё начинается с нуля.',s3:'Каждый может стать первым.',
    navWhy:'Почему Twin Queens',
    wh:'Новый уровень сложности',
    wl:'Классические шахматы изучены вдоль и поперёк: дебюты расписаны на десятки ходов вперёд, а компьютеры знают лучший ход почти в любой позиции. Twin Queens — шахматы, в которых всё это ещё предстоит открыть.',
    w1h:'Больше вариантов',w1:'Уже на пятом полуходе возможных партий почти вдвое больше, чем в классике: 8,6 млн против 4,9 млн. Каждый ход — больше решений и больше острых позиций.',
    w2h:'Ноль заученной теории',w2:'У соперника нет наработанных схем, домашних заготовок и выученных ловушек. Никто не разыграет против вас партию, найденную компьютером годы назад.',
    w3h:'Все равны',w3:'Ставка только на логику, расчёт и фантазию. Неважно, сколько лет вы учили дебюты, — здесь побеждает тот, кто лучше думает за доской.',
    r1h:'Расстановка',r1:'Девять вертикалей (a–i) и восемь горизонталей. Перед фигурами — девять пешек. Ферзи стоят по обе стороны от короля, слоны — на полях разного цвета.',
    r2h:'Ходы',r2:'Все фигуры ходят как в классических шахматах: взятие на проходе, превращение пешки, шах и мат, пат, правило 50 ходов и троекратное повторение.',
    r3h:'Рокировка',r3:'Король стоит на e. Короткая рокировка: король e→g, ладья i→f. Длинная: король e→c, ладья a→d. Условия те же, что в обычных шахматах.',
    credits:'Фигуры: Colin M. L. Burnett (лицензия BSD/GPL/GFDL). Шрифты: Playfair Display и Cinzel (SIL Open Font License).'
  },
  en:{
    lead:'Mastered classical chess? Try the next level. Chess on a 9 by 8 board with two queens per side: familiar rules, more possibilities and no memorised lines. Everyone starts equal — logic wins.',
    s1:'New chess: empty ratings, no opening theory.',s2:'Everything starts from zero.',s3:'Anyone can be the first.',
    navWhy:'Why Twin Queens',
    wh:'A new level of complexity',
    wl:'Classical chess has been studied inside out: openings are mapped dozens of moves deep, and computers know the best move in almost any position. Twin Queens is chess where all of that is still waiting to be discovered.',
    w1h:'More possibilities',w1:'After just five half-moves there are almost twice as many possible games as in classical chess: 8.6 million versus 4.9 million. More decisions and sharper positions on every move.',
    w2h:'Zero memorised theory',w2:'Your opponent has no prepared schemes, no home analysis and no memorised traps. Nobody can replay a computer-found line against you.',
    w3h:'Everyone is equal',w3:'It all comes down to logic, calculation and imagination. However long you have studied openings, here the winner is whoever thinks better at the board.',
    r1h:'Setup',r1:'Nine files (a–i) and eight ranks. Nine pawns in front. A queen stands on each side of the king, and the bishops are on opposite colours.',
    r2h:'Moves',r2:'Every piece moves as in classical chess: en passant, promotion, check and mate, stalemate, the 50-move rule and threefold repetition.',
    r3h:'Castling',r3:'The king starts on e. Short castling: king e→g, rook i→f. Long castling: king e→c, rook a→d. Same conditions as in ordinary chess.',
    credits:'Pieces by Colin M. L. Burnett (BSD/GPL/GFDL). Fonts: Playfair Display and Cinzel (SIL Open Font License).'
  }
};
var lang=tqLang();
function apply(){
  var T=TQ_I18N[lang],X=L[lang];document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(function(el){el.textContent=T[el.dataset.t]});
  document.querySelectorAll('[data-l]').forEach(function(el){el.textContent=X[el.dataset.l]});
  document.getElementById('langBtn').textContent=T.lang;
  document.title=T.title;
}
document.getElementById('langBtn').onclick=function(){lang=lang==='ru'?'en':'ru';tqSetLang(lang);apply()};
document.getElementById('setupRow').innerHTML=['R','N','B','Q','K','Q','N','B','R'].map(function(p){return '<img src="assets/pieces/w'+p+'.svg" alt="'+p+'">'}).join('');
/* inside the Android app there is nothing to download */
if(window.Capacitor||/TwinQueensApp/.test(navigator.userAgent)){var a=document.getElementById('apkBtn');a.parentNode.removeChild(a)}
apply();
if(!window.Capacitor&&'serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
