<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Twin Queens — играть</title>
<meta name="description" content="Twin Queens: шахматы на доске 9×8 с двумя ферзями. Играйте с компьютером или с другом на одном устройстве.">
<meta name="theme-color" content="#0e4a40">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="./"><img src="assets/icons/icon-192.png" alt=""><b class="gold">Twin Queens</b></a>
  <span class="sp"></span>
  <a class="navlink hide-m" href="./#rules" data-t="rules">Правила</a>
  <button class="langbtn" id="langBtn">English</button>
</header>

<div class="wrap">
  <div class="boardcol">
    <div class="pbar" id="topBar"></div>
    <div class="frame"><div class="board" id="board" aria-label="9×8"></div></div>
    <div class="pbar" id="botBar"></div>
  </div>

  <aside class="panel">
    <div class="phead">
      <img src="assets/icons/icon-192.png" alt="">
      <div><h1 class="gold">Twin Queens</h1><p>9 × 8 · ♛♛</p></div>
    </div>
    <div class="status" id="status"></div>
    <div class="moves" id="moves"></div>
    <div class="tools">
      <button class="btn" id="undoBtn">↶ <span data-t="undo"></span></button>
      <button class="btn" id="flipBtn">⇅ <span data-t="flip"></span></button>
      <button class="btn primary" id="newBtn" data-t="newGame"></button>
    </div>
    <div class="settings">
      <label><span data-t="opponent"></span><select id="selMode"></select></label>
      <label><span data-t="yourColor"></span><select id="selSide"></select></label>
      <label><span data-t="level"></span><select id="selLevel"></select></label>
      <label><span data-t="time"></span><select id="selTime"></select></label>
    </div>
  </aside>
</div>

<script src="i18n.js"></script>
<script src="engine.js"></script>
<script src="game.js"></script>
<script>if(!window.Capacitor&&'serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(function(){});</script>
</body>
</html>
